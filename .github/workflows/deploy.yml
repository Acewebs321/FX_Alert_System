name: Deploy to GCP VM

on:
  push:
    branches: [ main, master ]

# Automatically cancel any older push that is still running or queued
concurrency:
  group: gcp-vm-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Hard safety timeout so a job can never hang for 20+ mins

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Add GCP VM to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts

      - name: Copy project files to GCP VM
        run: |
          rsync -avz --exclude '.git' --exclude 'venv' --exclude '__pycache__' ./ ${{ secrets.GCP_SSH_USER }}@${{ secrets.GCP_VM_IP }}:~/fx_scanner/

      - name: Restart the Scanner App
        run: |
          ssh -o ServerAliveInterval=15 ${{ secrets.GCP_SSH_USER }}@${{ secrets.GCP_VM_IP }} << 'EOF'
            set -e
            cd ~/fx_scanner

            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            ./venv/bin/pip install --upgrade pip --quiet
            ./venv/bin/pip install requests pandas numpy flask joblib scikit-learn xgboost --quiet

            # Stop old tmux session and any process on port 8001
            tmux kill-session -t scanner 2>/dev/null || true
            pkill -f "app.py" 2>/dev/null || true
            sleep 1

            # CRITICAL: Redirect stdin/stdout/stderr on tmux itself so SSH does not hang!
            tmux new-session -d -s scanner "cd ~/fx_scanner && ./venv/bin/python3 app.py > scanner.log 2>&1" < /dev/null > /dev/null 2>&1

            sleep 3
            if pgrep -f "app.py" > /dev/null; then
              echo "✅ Scanner deployed and running!"
              tail -n 15 scanner.log
            else
              echo "❌ app.py crashed on startup! Error log:"
              cat scanner.log
              exit 1
            fi
            exit 0
          EOF