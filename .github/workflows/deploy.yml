name: Deploy to GCP VM

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_PRIVATE_KEY }}

      - name: Add GCP VM to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.GCP_VM_IP }} >> ~/.ssh/known_hosts

      - name: Copy project files to GCP VM
        run: |
          rsync -avz --exclude '.git' --exclude 'venv' --exclude '__pycache__' ./ ${{ secrets.GCP_SSH_USER }}@${{ secrets.GCP_VM_IP }}:~/fx_scanner/

      - name: Restart the Scanner App
        run: |
          ssh ${{ secrets.GCP_SSH_USER }}@${{ secrets.GCP_VM_IP }} << 'EOF'
            set -e
            cd ~/fx_scanner

            # Create virtual environment if missing
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # Install all required packages directly into venv (no requirements.txt needed)
            ./venv/bin/pip install --upgrade pip --quiet
            ./venv/bin/pip install requests pandas numpy flask joblib scikit-learn xgboost --quiet

            # Stop old tmux session and any stuck process on port 8001
            tmux kill-session -t scanner || true
            pkill -f "app.py" || true
            sleep 1

            # Start app.py using the explicit venv python path and log output
            tmux new-session -d -s scanner "cd ~/fx_scanner && ./venv/bin/python3 app.py > scanner.log 2>&1"

            # Wait 3 seconds and verify app.py is alive
            sleep 3
            if pgrep -f "app.py" > /dev/null; then
              echo "✅ Scanner deployed and running!"
              tail -n 20 scanner.log
            else
              echo "❌ app.py crashed on startup! Error log:"
              cat scanner.log
              exit 1
            fi
          EOF